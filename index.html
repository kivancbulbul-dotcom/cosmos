<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'sha256-MEt33MjvZN+0uvcD01SH39lFtsyKSp4oilZ8rZkmyRo='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Cosmos Rezervasyon</title>
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#ecdfc6" />
<meta name="referrer" content="no-referrer" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Cosmos Rezervasyon" />
<link rel="icon" href="icon-192.png" />
<link rel="apple-touch-icon" href="icon-192.png" />
<style>
  :root{
    --bg:#ecdfc6;
    --panel:#e2d3b3;
    --ink:#2a2620;
    --ink-soft:#6b6255;
    --wall:#000000;
    --floor:#e2d3b3;
    --floor-grain:rgba(120,96,60,0.10);
    --wood-edge:#5a3a1a;
    --wood-bot:#7a5326;
    --kolon:#6b6255;
    --free:#3fae5c;
    --free-dark:#2c8946;
    --occ:#e0574d;
    --occ-dark:#c0433a;
    --member:#e6994a;
    --member-dark:#bd7726;
    --chair-color:#2c2c2c;
    --chair-color-dark:#000000;
    --shadow: rgba(0,0,0,0.25);
    --header-a:#ecdfc6;
    --header-b:#ecdfc6;
    --door:#3fae5c;
    --accent:#6b5333;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-tap-highlight-color:transparent;
    padding-bottom:24px;
  }

  header{
    padding:18px 16px;
    background:linear-gradient(135deg,var(--header-a),var(--header-b));
    color:var(--ink);
    text-align:center;
  }
  header img.brand-logo{
    display:block;
    margin:0 auto;
    height:clamp(64px,10.5vw,92px);
    width:auto;
    max-width:88%;
  }

  /* ---- Genel özet (her zaman görünür) ---- */
  .overview{
    display:flex; gap:10px; justify-content:center; flex-wrap:wrap;
    padding:14px 12px 6px;
  }
  .overview-card{
    background:var(--panel);
    border-radius:16px;
    padding:12px 18px;
    box-shadow:0 2px 8px var(--shadow);
    cursor:pointer;
    border:2px solid transparent;
    text-align:left;
    display:flex;
    align-items:center;
    gap:12px;
  }
  .overview-card.active{ border-color:var(--accent); }
  .overview-card:active{ opacity:0.85; }
  .overview-card .oc-title{ font-weight:800; font-size:16.5px; white-space:nowrap; }
  .overview-card .oc-row{ display:flex; gap:10px; padding-left:10px; border-left:1px solid rgba(0,0,0,0.15); }
  .overview-card .oc-stat{ display:flex; flex-direction:column; align-items:center; line-height:1.15; min-width:26px; }
  .overview-card .oc-stat b{ font-size:13.5px; }
  .overview-card .oc-stat span{ font-size:8.5px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:0.3px; }
  .oc-free b{ color:var(--free-dark); }
  .oc-occ b{ color:var(--occ-dark); }
  .oc-resv b{ color:var(--member-dark); }
  .oc-total b{ color:var(--ink); }

  .grand-total{
    text-align:center; font-size:14.5px; color:var(--ink-soft);
    padding:8px 12px 2px;
  }
  .grand-total b{ color:var(--ink); }


  .room-header-row{ display:flex; align-items:center; justify-content:center; gap:16px; flex-wrap:wrap; margin:2px 0 4px; }
  .statbar{ display:flex; gap:6px; justify-content:flex-end; flex-wrap:wrap; padding:0; }
  .stat{ background:var(--panel); border-radius:12px; padding:5px 10px; box-shadow:0 2px 8px var(--shadow); text-align:center; min-width:50px; }
  .stat .num{ font-size:15px; font-weight:800; line-height:1.1; }
  .stat .lab{ font-size:8.5px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:0.3px; }
  .stat.free .num{ color:var(--free-dark); }
  .stat.occ .num{ color:var(--occ-dark); }
  .stat.member .num{ color:var(--member-dark); }

  .legend{ display:flex; justify-content:center; gap:9px; padding:1px 12px 4px; font-size:8px; color:var(--ink-soft); flex-wrap:wrap; }
  .legend span{ display:inline-flex; align-items:center; gap:3px; }
  .swatch{ width:6px; height:6px; border-radius:50%; display:inline-block; }
  .swatch.free{ background:var(--free); }
  .swatch.occ{ background:var(--occ); }
  .swatch.member{ background:var(--member); }
  .swatch.pend{ background:#d9b64a; }

  .room-wrapper{ overflow-x:auto; overflow-y:visible; padding:0 8px 8px; }
  .room-scale{ width:100%; max-width:1150px; margin:0 auto; position:relative; }
  .room-scale.room-scale--wide{ max-width:none; }

  .room-title{ text-align:right; font-weight:800; font-size:clamp(18px,3.6vw,26px); letter-spacing:1px; margin:0; color:var(--ink); flex:0 0 auto; }
  .compass{ position:absolute; top:8px; right:8px; text-align:center; font-size:10px; color:var(--ink-soft); z-index:5; }
  .compass .arrow{ display:block; font-size:18px; line-height:1; color:var(--ink); }

  .room-inner{ width:min(100%, calc((100vh - 320px) * 1.6327)); margin:0 auto; }

  .room-crop{
    position:relative;
    width:100%;
    overflow:hidden;
    aspect-ratio: 1600 / 980;
    container-type: inline-size;   /* içerideki yazılar kroki genişliğine göre ölçeklenir (cqw) */
  }
  .room{
    position:absolute;
    top:0; left:0;
    width:100%;
    aspect-ratio: 1600 / 980;
    background-color:var(--floor);
  }
  .room.rect-room{ border:7px solid var(--wall); border-radius:0; }

  .fixed-el{ position:absolute; transform:translate(-50%,-50%); pointer-events:none; }

  .kolon-box{
    width:100%; height:100%;
    background:repeating-linear-gradient(0deg, var(--kolon), var(--kolon) 10px, #00000022 10px, #00000022 11px);
    color:#fff; display:flex; align-items:center; justify-content:center;
    writing-mode:vertical-rl; font-size:11px; font-weight:700; letter-spacing:2px;
    border-radius:2px; box-shadow:0 2px 6px var(--shadow);
  }
  .kitaplik-box{
    width:100%; height:100%;
    background: linear-gradient(90deg,var(--wood-edge),var(--wood-bot));
    color:#f1ece0; display:flex; align-items:center; justify-content:center;
    writing-mode:vertical-rl; font-size:10px; font-weight:700; letter-spacing:1.5px;
    border-radius:4px; box-shadow:0 2px 8px var(--shadow);
    background-image:
      repeating-linear-gradient(0deg, transparent 0 18px, rgba(0,0,0,0.18) 18px 20px),
      linear-gradient(90deg,var(--wood-edge),var(--wood-bot));
  }
  .giris-el{ text-align:center; color:#2a2620; font-size:11px; font-weight:700; white-space:nowrap; }
  .giris-el .strip{ width:56px; height:8px; background:var(--door); border-radius:3px; margin:0 auto 4px; }
  .giris-el--big{ font-size:16.5px; }
  .giris-el--big .strip{ width:84px; height:12px; }
  .giris-el--big2{ font-size:22px; }
  .giris-el--big2 .strip{ width:112px; height:16px; }
  .giris-el--big140{ font-size:15.4px; }
  .giris-el--big140 .strip{ width:78.4px; height:11.2px; }
  .pencere-el{ color:var(--ink-soft); font-size:9px; font-weight:700; letter-spacing:1px; white-space:nowrap; }

  /* ---- Kroki içi öğeler kroki genişliğiyle ölçeklenir (950px genişlik = tasarım ölçüsü) ---- */
  .giris-el{ font-size:clamp(7px,1.16cqw,11px); }
  .giris-el .strip{ width:5.9cqw; height:0.84cqw; min-height:4px; }
  .giris-el--big{ font-size:clamp(8px,1.74cqw,16.5px); }
  .giris-el--big .strip{ width:8.84cqw; height:1.26cqw; }
  .giris-el--big140{ font-size:clamp(8px,1.62cqw,15.4px); }
  .giris-el--big140 .strip{ width:8.25cqw; height:1.18cqw; }
  .giris-el--big2{ font-size:clamp(9px,2.32cqw,22px); }
  .giris-el--big2 .strip{ width:11.8cqw; height:1.68cqw; }
  .kolon-box{ font-size:clamp(7px,1.16cqw,11px); }
  .kitaplik-box{ font-size:clamp(7px,1.05cqw,10px); }

  /* ---- Dolaplar ---- */
  .giris-el--vertical{ display:flex; align-items:center; gap:8px; gap:0.84cqw; font-size:14px; font-size:clamp(7px,1.47cqw,14px); }
  .giris-el--vertical .giris-text{ text-align:right; line-height:1.15; }
  .giris-el--vertical .strip{ width:11px; height:88px; width:1.16cqw; height:9.26cqw; margin:0; border-radius:3px; flex:0 0 auto; }
  .dolap-blok-box{
    width:100%; height:100%; border-radius:4px;
    background:linear-gradient(180deg,#3b3530,#24201c);
    box-shadow:0 3px 8px var(--shadow);
  }
  .kroki-etiket{ font-weight:800; font-size:14px; font-size:clamp(7px,1.47cqw,14px); letter-spacing:0.22em; color:#2a2620; white-space:nowrap; }
  .merdiven-svg{ display:block; width:100%; height:100%; filter:drop-shadow(0 2px 4px rgba(0,0,0,0.25)); }
  .locker-wrap{ position:absolute; transform:translate(-50%,-50%); }
  .table-body.locker-body{
    border-radius:3px;
    border:1px solid rgba(0,0,0,0.35);
    box-shadow:inset 0 0 0 1px rgba(255,255,255,0.18), 0 1px 2px rgba(0,0,0,0.35);
  }
  .table-body.locker-body::after{
    content:""; position:absolute; right:12%; top:50%; transform:translateY(-50%);
    width:3px; height:20%; min-height:8px; max-height:22px;
    background:rgba(255,255,255,0.8); border-radius:2px; pointer-events:none;
  }
  /* Dolaplarda isim kesilmez: gerekirse satıra bölünür, yazı boyutu sığana kadar küçültülür (fitLockerName) */
  .locker-body .t-resv-name{
    white-space:normal; text-overflow:clip; overflow:hidden;
    line-height:1.08; text-align:center; max-width:94%;
    word-break:normal; overflow-wrap:normal;
  }
  /* Uzun (dikey) dolaplarda kulp numaranın altında, sağ alt bölgede */
  .table-body.locker-body--tall::after{ top:auto; bottom:12%; right:50%; transform:translateX(50%); width:40%; max-width:16px; height:3px; min-height:3px; }

  .table-wrap{
    position:absolute;
    transform:translate(-50%,-50%);
    width:7%;
    height:6.2%;
    min-width:32px;
    min-height:28px;
  }
  .table-wrap.vertical{ width:3.8%; height:11.4%; }
  .table-wrap.table-wrap--big{ width:8.4%; height:8.1%; min-width:38px; min-height:34px; }
  .table-wrap.table-wrap--big.vertical{ width:5.2%; height:13.68%; }
  .table-wrap.table-wrap--saturn{ width:7%; height:7.9%; }
  .table-wrap.table-wrap--saturn.vertical{ width:5.3%; height:11.4%; }
  .table-wrap.table-wrap--jupiter{ width:8.05%; height:7.13%; }
  .table-wrap.table-wrap--jupiter.vertical{ width:4.37%; height:13.11%; }
  .table-body{
    position:absolute; inset:0;
    border-radius:5px;
    background:linear-gradient(180deg,var(--free),var(--free-dark));
    border:1px solid rgba(0,0,0,0.25);
    box-shadow:0 3px 6px var(--shadow);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    font-weight:800; font-size:clamp(12px,1.9vw,17px); font-size:clamp(9px,1.79cqw,17px); color:#fff;
    cursor:pointer;
    user-select:none;
    transition: background 0.15s ease;
    line-height:1.1;
  }
  .table-body:active{ filter:brightness(0.95); }
  .table-body.status-dolu{ background:linear-gradient(180deg,var(--occ),var(--occ-dark)); }
  .table-body.status-rezerve{ background:linear-gradient(180deg,var(--member),var(--member-dark)); }
  .table-body.pending{ outline:2px dashed #d9b64a; outline-offset:2px; }
  .table-body.resv-ended{ outline:2px solid var(--member); outline-offset:2px; }
  .t-resv-name{ font-size:0.85em; font-weight:600; opacity:0.9; max-width:95%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .t-resv-name.t-resv-warning{ opacity:1; color:#3a2c00; background:var(--member); border-radius:4px; padding:0 4px; font-weight:800; }
  svg.resv-star{
    position:absolute;
    top:0; left:0;
    width:1.9em; height:1.9em;
    overflow:visible;
    fill:#ffd966;
    stroke:#a8720a;
    stroke-width:0.6;
    stroke-linejoin:round;
    animation: starPulse 1.4s ease-in-out infinite;
    transform-origin:center;
    pointer-events:none;
    z-index:2;
  }
  @keyframes starPulse{
    0%, 100%{ transform:translate(-50%,-50%) scale(0.85); }
    50%{ transform:translate(-50%,-50%) scale(1.15); }
  }

  .chair{
    position:absolute;
    width:46%; height:38%;
    border-radius:50%;
    background:linear-gradient(180deg,var(--chair-color),var(--chair-color-dark));
    box-shadow:0 2px 5px var(--shadow);
    pointer-events:none;
  }
  .chair.side-bottom{ left:50%; bottom:-42%; transform:translateX(-50%); }
  .chair.side-top{ left:50%; top:-42%; transform:translateX(-50%); }
  .chair.side-left{ top:50%; left:-42%; transform:translateY(-50%); }
  .chair.side-right{ top:50%; right:-42%; transform:translateY(-50%); }

  footer.status{ text-align:center; font-size:11px; color:var(--ink-soft); padding:10px 16px 0; }
  .controls{ display:flex; justify-content:center; padding:10px 16px 0; flex-wrap:wrap; gap:8px; }
  .reset-btn{ background:var(--panel); color:var(--occ-dark); border:1px solid var(--occ); border-radius:10px; padding:8px 14px; font-size:12px; font-weight:700; cursor:pointer; }
  .reset-btn:active{ opacity:0.7; }
  .resv-open-btn{ color:var(--accent); border-color:var(--accent); }
  .undo-btn{ color:var(--accent); border-color:var(--accent); }
  .undo-btn:disabled{ opacity:0.35; cursor:not-allowed; }
  .undo-btn:disabled:active{ opacity:0.35; }
  .redo-btn{ color:var(--accent); border-color:var(--accent); }
  .redo-btn:disabled{ opacity:0.35; cursor:not-allowed; }
  .redo-btn:disabled:active{ opacity:0.35; }

  .modal-backdrop{
    display:none; position:fixed; inset:0; background:rgba(0,0,0,0.45);
    align-items:center; justify-content:center; z-index:100; padding:16px;
  }
  .modal-backdrop.open{ display:flex; }
  .modal-box{
    background:var(--panel); color:var(--ink); border-radius:14px;
    padding:18px 18px 14px; width:100%; max-width:360px;
    box-shadow:0 10px 30px rgba(0,0,0,0.35);
  }
  .modal-box h2{ margin:0 0 12px; font-size:16px; }
  .modal-box label{ display:block; font-size:12px; color:var(--ink-soft); margin-bottom:10px; }
  .modal-box select, .modal-box input{
    display:block; width:100%; margin-top:4px; padding:8px 10px; border-radius:8px;
    border:1px solid rgba(0,0,0,0.2); background:var(--bg); color:var(--ink); font-size:14px;
  }
  .modal-hint{ font-size:11px; color:var(--ink-soft); margin:6px 0 14px; line-height:1.4; }
  .modal-actions{ display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end; }
  .modal-btn{
    border-radius:9px; padding:8px 12px; font-size:12px; font-weight:700;
    border:1px solid rgba(0,0,0,0.2); background:var(--bg); color:var(--ink); cursor:pointer;
  }
  .modal-btn.primary{ background:var(--free); border-color:var(--free-dark); color:#fff; }
  .modal-btn.danger{ background:transparent; border-color:var(--occ); color:var(--occ-dark); margin-right:auto; }
  .modal-btn:disabled{ opacity:0.5; cursor:wait; }
  .modal-btn.danger-solid{ background:var(--occ); border-color:var(--occ-dark); color:#fff; }
  #confirmBackdrop{ z-index:150; }
  .confirm-box{ max-width:340px; }
  .confirm-text{ margin:2px 0 16px; font-size:14px; line-height:1.45; color:var(--ink); }

  body:not(.local-mode) .local-only{ display:none !important; }
  .mini-btn{ background:transparent; color:var(--ink-soft); border:1px solid rgba(0,0,0,0.2); border-radius:8px; padding:5px 10px; font-size:11px; font-weight:700; cursor:pointer; }
  .mini-btn:active{ opacity:0.7; }
  footer.status.status-error{ color:var(--occ-dark); font-weight:700; }

  /* ---- Bildirim balonu ---- */
  @media (orientation: landscape) and (max-height: 820px){
    header{ padding:6px 16px 0; }
    header img.brand-logo{ height:52px; }
    .grand-total{ padding:2px 12px 0; font-size:13px; }
    .overview{ padding:6px 12px 2px; gap:8px; }
    .overview-card{ padding:6px 14px; border-radius:12px; }
    .overview-card .oc-title{ font-size:15px; }
    .legend{ padding:0 12px 2px; }
    .room-header-row{ margin:0 0 3px; gap:12px; }
    .room-title{ font-size:20px; }
    .stat{ padding:3px 9px; }
    .stat .num{ font-size:14px; }
    .room-wrapper{ padding-bottom:4px; }
    .controls{ padding-top:6px; }
    footer.status{ padding-top:3px; font-size:10px; }
    body{ padding-bottom:6px; }
  }

  .toast{
    position:fixed; left:50%; bottom:22px; transform:translate(-50%, 20px);
    background:var(--ink); color:var(--bg); padding:10px 16px; border-radius:10px;
    font-size:13px; font-weight:600; max-width:calc(100% - 32px); text-align:center;
    box-shadow:0 6px 20px rgba(0,0,0,0.25); opacity:0; pointer-events:none;
    transition:opacity .2s ease, transform .2s ease; z-index:200;
  }
  .toast.show{ opacity:1; transform:translate(-50%, 0); }
</style>
</head>
<body>

<header>
  <img class="brand-logo" src="logo.png" alt="Cosmos Coffee Library" />
</header>

<div class="grand-total" id="grandTotal"></div>

<div class="overview" id="overview"></div>

<div class="legend">
  <span><i class="swatch free"></i>Boş</span>
  <span><i class="swatch occ"></i>Dolu</span>
  <span><i class="swatch member"></i>Rezerve</span>
  <span><i class="swatch pend"></i>Güncelleniyor</span>
</div>

<div class="room-wrapper">
  <div class="room-scale" id="roomScale">
    <div class="room-inner" id="roomInner">
      <div class="room-header-row">
        <div class="room-title" id="roomTitle"></div>
        <div class="statbar">
          <div class="stat free"><div class="num" id="freeCount">-</div><div class="lab">Boş</div></div>
          <div class="stat occ"><div class="num" id="occCount">-</div><div class="lab">Dolu</div></div>
          <div class="stat member"><div class="num" id="memberCount">-</div><div class="lab">Rezerve</div></div>
          <div class="stat"><div class="num" id="totalCount">-</div><div class="lab">Toplam</div></div>
        </div>
      </div>
      <div class="room-crop" id="roomCrop">
        <div class="room" id="room"></div>
      </div>
    </div>
  </div>
</div>

<div class="controls">
  <button class="reset-btn undo-btn" id="undoBtn" disabled>↶ Geri Al</button>
  <button class="reset-btn redo-btn" id="redoBtn" disabled>↷ İleri Al</button>
  <button class="reset-btn" id="resetBtn">Bu Salonu Boşalt</button>
  <button class="reset-btn resv-open-btn" id="resvOpenBtn">Rezervasyon Ekle / Düzenle</button>
  <button class="mini-btn local-only" id="backupBtn">Yedek Al</button>
  <button class="mini-btn local-only" id="restoreBtn">Yedekten Yükle</button>
  <input type="file" id="restoreFile" accept="application/json,.json" hidden />
</div>

<footer class="status" id="syncStatus">Bağlanılıyor…</footer>

<div class="modal-backdrop" id="resvBackdrop">
  <div class="modal-box">
    <h2 id="resvTitle">Rezervasyon</h2>
    <label><span id="resvUnitLabel">Masa</span>
      <select id="resvTableSelect"></select>
    </label>
    <label>Ad Soyad
      <input type="text" id="resvName" placeholder="Örn. Ayşe Yılmaz" maxlength="60" autocomplete="off" />
    </label>
    <label>Rezervasyon Başlangıç
      <input type="date" id="resvStart" />
    </label>
    <label>Rezervasyon Bitiş
      <input type="date" id="resvEnd" />
    </label>
    <p class="modal-hint">Bu tarih aralığında seçilen masa veya dolap otomatik olarak <b>rezerve (turuncu)</b> görünür. Kişi geldiğinde üzerine tıklayarak o günlük <b>dolu (kırmızı)</b> olarak işaretleyebilirsiniz.</p>
    <div class="modal-actions">
      <button id="resvClearBtn" class="modal-btn danger">Rezervasyonu Kaldır</button>
      <button id="resvCancelBtn" class="modal-btn">Vazgeç</button>
      <button id="resvSaveBtn" class="modal-btn primary">Kaydet</button>
    </div>
  </div>
</div>

<div class="modal-backdrop" id="confirmBackdrop">

  var NAME_MAX = 60;               // ad-soyad için azami karakter
  var RETENTION_DAYS = 30;         // rezervasyon verisi bitişten kaç gün sonra silinir
  var DATE_RE = /^\d{4}-\d{2}-\d{2}$/;
  function isDateStr(v){ return typeof v === "string" && DATE_RE.test(v); }
  function cleanName(v){
    if(typeof v !== "string") return "";
    return v.replace(/[\u0000-\u001f\u007f]/g, "").replace(/\s+/g, " ").trim().slice(0, NAME_MAX);
  }
  // Yalnızca gerçekten tanımlı masa anahtarlarını kabul et ("constructor", "__proto__" gibi anahtarları reddeder)
  function hasKey(k){ return typeof k === "string" && Object.prototype.hasOwnProperty.call(state, k); }
  // Herkese açık ekranda isim kısaltma: "Ayşe Yılmaz" -> "Ayşe Y."
  function maskName(n){
    var parts = cleanName(n).split(" ").filter(Boolean);
    if(parts.length === 0) return "";
    if(parts.length === 1) return parts[0];
    return parts[0] + " " + parts[parts.length-1].charAt(0).toLocaleUpperCase("tr-TR") + ".";
  }
  function sameSnap(a, b){
    if(!a || !b) return false;
    return a.status === b.status && a.resvName === b.resvName && a.resvStart === b.resvStart &&
           a.resvEnd === b.resvEnd && a.overrideDate === b.overrideDate;
  }
  function todayStr(){
    var d = new Date();
    var p = function(n){ return (n<10?"0":"")+n; };
    return d.getFullYear() + "-" + p(d.getMonth()+1) + "-" + p(d.getDate());
  }
  ROOM_ORDER.forEach(function(rid){
    ROOMS[rid].tables.forEach(function(t){ state[key(rid,t.id)] = blankTableData(); });
  });

  function hasActiveReservation(s, today){
    return !!(s.resvStart && s.resvEnd && today >= s.resvStart && today <= s.resvEnd);
  }

  function addDaysStr(dateStr, n){
    if(!isDateStr(dateStr)) return "";
    var parts = dateStr.split("-");
    var d = new Date(parseInt(parts[0],10), parseInt(parts[1],10)-1, parseInt(parts[2],10));
    d.setDate(d.getDate() + n);
    var p = function(v){ return (v<10?"0":"")+v; };
    return d.getFullYear() + "-" + p(d.getMonth()+1) + "-" + p(d.getDate());
  }

  function reservationEndedYesterday(s, today){
    return !!(s.resvEnd && !hasActiveReservation(s, today) && addDaysStr(s.resvEnd, 1) === today);
  }

  function getDisplayStatus(k){
    var s = state[k] || blankTableData();
    var today = todayStr();
    if(hasActiveReservation(s, today)){

    }
    return s.status === "dolu" ? "dolu" : "bos";
  }

      for(var si = 0; si < steps; si++){
        var tt = si / (steps - 1);
        var col = "rgb(" + c0.map(function(v,ix){ return Math.round(v + (c1[ix]-v)*tt); }).join(",") + ")";
        var tread = document.createElementNS(ns, "rect");
        tread.setAttribute("x", (si*sw).toFixed(2)); tread.setAttribute("y", "0");

    (room.extras || []).forEach(function(e){ renderExtra(roomEl, e); });

    room.tables.forEach(function(t){

      } else {

      body.className = t.locker
        ? "table-body locker-body" + ((t.h * 980) > (t.w * 1600) ? " locker-body--tall" : "")

      var labelSpan = document.createElement("span");
      labelSpan.textContent = t.label;
      var nameSpan = document.createElement("span");
      nameSpan.className = "t-resv-name";
      var starSvgNS = "http://www.w3.org/2000/svg";
      var starSvg = document.createElementNS(starSvgNS, "svg");
      starSvg.setAttribute("class", "resv-star");
      starSvg.setAttribute("viewBox", "0 0 24 24");
      starSvg.setAttribute("aria-hidden", "true");
      starSvg.style.display = "none";
      var starPath = document.createElementNS(starSvgNS, "path");
      starPath.setAttribute("d", "M12 2.5l2.95 6.28 6.88.86-5.06 4.77 1.38 6.84L12 17.98l-6.15 3.27 1.38-6.84-5.06-4.77 6.88-.86L12 2.5z");
      starSvg.appendChild(starPath);

      body.addEventListener("click", function(){ onTableClick(rid, t.id); });
      body.addEventListener("keydown", function(ev){ if(ev.key==="Enter"||ev.key===" "){ ev.preventDefault(); onTableClick(rid, t.id);} });

      if(!t.locker){

      roomTitleEl.textContent = room.titleText;

      var titleName = titleNameMap[room.name] || room.name.toUpperCase();

  function renderTableEl(k){
    if(!hasKey(k)) return;
    var display = getDisplayStatus(k);
    var body = buttons[k];
    if(body){
      body.classList.remove("status-dolu","status-rezerve");
      if(display === "dolu") body.classList.add("status-dolu");
      else if(display === "rezerve") body.classList.add("status-rezerve");
    }
    var s = state[k] || blankTableData();
    var nameEl = nameEls[k];

    var endedWarning = reservationEndedYesterday(s, today);
    if(body){
      body.classList.toggle("resv-ended", endedWarning);
      body.title = endedWarning ? ("Rezervasyon " + s.resvEnd + " tarihinde sona erdi." + (s.resvName ? (" (" + maskName(s.resvName) + ")") : "")) : "";
    }

    var showStar = (display === "rezerve" || display === "dolu") && !!s.resvName;
    if(starEl) starEl.style.display = showStar ? "block" : "none";
    if(nameEl){
      if(showStar){

  // Dolaplarda ismi kutuya sığdır: önce yazı boyutunu okunur sınıra (9.5px) kadar küçült;
  // hâlâ sığmıyorsa uzun kelimeyi satıra böl; gerekirse en son 7.5px'e kadar küçült.
  function fitLockerName(el){
    var body = el.parentElement;
    if(!body || !body.classList.contains("locker-body")) return;
    el.style.fontSize = "";
    el.style.overflowWrap = "";
    if(el.style.display === "none" || !el.textContent) return;
    var size = parseFloat(getComputedStyle(el).fontSize) || 12;
    var maxH = body.clientHeight * 0.58;
    function over(){ return el.scrollWidth > el.clientWidth + 0.5 || el.scrollHeight > maxH; }
    var guard = 0;
    while(over() && size > 8 && guard++ < 40){ size -= 0.5; el.style.fontSize = size + "px"; }
    if(over()){
      el.style.overflowWrap = "anywhere";
      while(over() && size > 7 && guard++ < 60){ size -= 0.5; el.style.fontSize = size + "px"; }
    }
  }
  // Krokiyi ekranda kalan gerçek alana sığdır: üstteki ve alttaki bölümlerin yüksekliğini ölçüp
  // kalan yüksekliğe göre genişliği belirler (oran 1600:980). Çok küçük ekranlarda okunabilirlik için
  // en az 520px'e iner; o durumda sayfa hafifçe kayar ama kroki hiçbir zaman kesilmez.
  var ROOM_RATIO = 1600 / 980;
  function fitRoomSize(){
    if(!roomInnerEl || !roomCropEl) return;
    var maxW = roomScaleEl.clientWidth;
    for(var pass = 0; pass < 2; pass++){
      var rect = roomCropEl.getBoundingClientRect();
      var scrollY = window.pageYOffset || document.documentElement.scrollTop || 0;
      var above = rect.top + scrollY;
      // Alttaki içeriğin gerçek yüksekliği (sayfanın boş kalan alt kısmı sayılmaz)
      var contentBottom = document.body.getBoundingClientRect().bottom + scrollY;
      var below = contentBottom - (rect.bottom + scrollY);
      var avail = window.innerHeight - above - below - 2;
      var w = Math.min(maxW, avail * ROOM_RATIO);
      w = Math.max(w, Math.min(maxW, 520));
      roomInnerEl.style.width = Math.floor(w) + "px";
    }
  }
  var fitTimer = null;
  function scheduleFit(){
    clearTimeout(fitTimer);
    fitTimer = setTimeout(function(){
      try{ fitRoomSize(); }catch(e){}
      try{ refreshTableVisuals(activeRoom); }catch(e){}
    }, 120);
  }
  window.addEventListener("resize", scheduleFit);
  window.addEventListener("orientationchange", scheduleFit);
  window.addEventListener("load", scheduleFit);

  // =========================================================================
  // KALICILIK (db / localStorage)
  // =========================================================================
  // Dışarıdan (veritabanı / yerel depo / yedek dosyası) gelen her kaydı güvenli biçime getirir.
  // Geçersiz tip, bozuk tarih veya aşırı uzun isim kabul edilmez.
  function normalizeData(data){
    var out = blankTableData();
    if(!data || typeof data !== "object") return out;
    if(typeof data.status === "string") out.status = (data.status === "dolu") ? "dolu" : "bos";
    else if(typeof data.occupied === "boolean") out.status = data.occupied ? "dolu" : "bos";
    // yeni düz alanlar (öncelikli)
    var name = cleanName(data.resvName);
    var start = data.resvStart, end = data.resvEnd;
    // eski iç içe "reservation" alanından geriye dönük uyumluluk
    if(!isDateStr(start) && data.reservation && typeof data.reservation === "object"){
      name = cleanName(data.reservation.name);
      start = data.reservation.start;
      end = data.reservation.end;
    }
    if(isDateStr(start) && isDateStr(end) && end >= start){
      out.resvName = name;
      out.resvStart = start;
      out.resvEnd = end;
    }
    if(isDateStr(data.overrideDate)) out.overrideDate = data.overrideDate;
    return out;
  }

  function applyStoredMap(parsed){
    if(!parsed || typeof parsed !== "object") return;
    Object.keys(parsed).forEach(function(k){
      if(hasKey(k)){
        try{ state[k] = normalizeData(parsed[k]); }catch(e){ state[k] = blankTableData(); }
      }
    });
  }
  function loadLocal(){
    localMode = true;
    document.body.classList.add("local-mode");
    try{
      var raw = localStorage.getItem(LOCAL_KEY);
      if(raw) applyStoredMap(JSON.parse(raw));
    }catch(e){}
    safeRenderAll();
    purgeExpired();
  }
  function saveLocal(){
    try{
      localStorage.setItem(LOCAL_KEY, JSON.stringify(state));
      clearSaveError();
    }catch(e){
      showSaveError("Bu cihaza kaydedilemedi (depolama dolu veya kapalı olabilir).");
    }
  }
  function setPending(k, on){ var body = hasKey(k) ? buttons[k] : null; if(body) body.classList.toggle("pending", !!on); }

  // ---- Kayıt durumu bildirimi (sessiz hata yerine görünür uyarı) ----
  var syncOkText = "";
  var saveErrorShown = false;
  function setSyncText(t){ syncOkText = t; if(!saveErrorShown) syncEl.textContent = t; }
  function showSaveError(msg){
    saveErrorShown = true;
    syncEl.textContent = "Uyarı: " + msg;
    syncEl.classList.add("status-error");
  }
  function clearSaveError(){
    if(!saveErrorShown) return;
    saveErrorShown = false;
    syncEl.textContent = syncOkText;
    syncEl.classList.remove("status-error");
  }

  // ---- Veritabanına yazma: belge başına sıralı, yalnızca değişen alanlar ----
  var ALL_FIELDS = ["status","resvName","resvStart","resvEnd","overrideDate"];
  var writeChains = {};
  function persist(k, fields, opts){
    if(!hasKey(k)) return;
    opts = opts || {};
    if(!db){ saveLocal(); return; }
    var s = state[k];
    var list = (fields && fields.length) ? fields : ALL_FIELDS;
    var body = {};
    list.forEach(function(f){ body[f] = s[f] || (f === "status" ? "bos" : ""); });
    body.updatedAt = new Date().toISOString();
    var full = {};
    ALL_FIELDS.forEach(function(f){ full[f] = s[f] || (f === "status" ? "bos" : ""); });
    full.updatedAt = body.updatedAt;
    var ref = db.collection("tables").doc(k);
    setPending(k, true);
    var prev = writeChains[k] || Promise.resolve();
    var next = prev.then(function(){
      // update(): yalnızca değişen alanları yazar, başka cihazın aynı anda yaptığı değişikliği ezmez.
      // Belge henüz yoksa update reddedilir; o zaman tam kayıt (set) yapılır.
      return ref.update(body).catch(function(err){
        if(err && err.code === "invalid_argument") return ref.set(full);
        throw err;
      });
    }).then(function(){
      if(!opts.silent) clearSaveError();
    }).catch(function(){
      if(!opts.silent) showSaveError("Son değişiklik kaydedilemedi. Bağlantıyı kontrol edip tekrar deneyin.");
    }).then(function(){
      setPending(k, false);
      if(writeChains[k] === next) delete writeChains[k];
    });
    writeChains[k] = next;
  }

  // =========================================================================
  // GERİ AL / İLERİ AL (UNDO / REDO)
  // =========================================================================
  var undoStack = [];
  var redoStack = [];
  var MAX_UNDO = 50;
  var undoBtn = document.getElementById("undoBtn");
  var redoBtn = document.getElementById("redoBtn");

  function snapshotOf(k){
    var s = state[k];
    return { status:s.status, resvName:s.resvName, resvStart:s.resvStart, resvEnd:s.resvEnd, overrideDate:s.overrideDate };
  }
  function changedFields(a, b){
    return ALL_FIELDS.filter(function(f){ return (a[f] || "") !== (b[f] || ""); });
  }
  // Her geri alma girdisi bir veya daha fazla masayı içerir: {rid, items:[{k, before, after}]}
  function pushUndoItems(rid, items){
    items = items.filter(function(it){ return !sameSnap(it.before, it.after); });
    if(!items.length) return;
    undoStack.push({ rid:rid, items:items });
    if(undoStack.length > MAX_UNDO) undoStack.shift();
    redoStack = [];
    updateUndoBtn();
    updateRedoBtn();
  }
  function pushUndo(rid, k, prevSnapshot){
    pushUndoItems(rid, [{ k:k, before:prevSnapshot, after:snapshotOf(k) }]);
  }
  // Girdi, işlemden sonra başka bir cihazda/işlemle değişmiş mi? ("expectKey" = şu an beklenen durum)
  function historyConflicts(entry, expectKey){
    return entry.items.some(function(it){ return !sameSnap(snapshotOf(it.k), it[expectKey]); });
  }
  var CONFLICT_MSG = "Bu kayıt(lar) bu işlemden sonra başka bir cihazda veya başka bir işlemle değiştirilmiş. Devam ederseniz daha yeni değişiklik silinecek.";
  // Girdiyi uygular: "toKey" = hedef durum ("before" geri al, "after" ileri al)
  function applyHistoryEntry(entry, toKey){
    entry.items.forEach(function(it){
      var cur = snapshotOf(it.k);
      state[it.k] = Object.assign({}, it[toKey]);
      renderTableEl(it.k);
      persist(it.k, changedFields(cur, state[it.k]));
    });
    renderRoomTableStates(entry.rid);
    renderOverview();
    return true;
  }
  function updateUndoBtn(){
    if(!undoBtn) return;
    undoBtn.disabled = undoStack.length === 0;
    undoBtn.textContent = undoStack.length ? ("↶ Geri Al (" + undoStack.length + ")") : "↶ Geri Al";
  }
  function updateRedoBtn(){
    if(!redoBtn) return;
    redoBtn.disabled = redoStack.length === 0;
    redoBtn.textContent = redoStack.length ? ("↷ İleri Al (" + redoStack.length + ")") : "↷ İleri Al";
  }
  function undoLast(){
    if(!requireStaff()) return;
    var entry = undoStack[undoStack.length - 1];
    if(!entry) return;
    var go = function(){
      if(!isUnlocked() || undoStack[undoStack.length - 1] !== entry) return;
      applyHistoryEntry(entry, "before");
      undoStack.pop();
      redoStack.push(entry);
      if(redoStack.length > MAX_UNDO) redoStack.shift();
      updateUndoBtn();
      updateRedoBtn();
    };
    if(historyConflicts(entry, "after")){
      askConfirm(CONFLICT_MSG, { yes:"Yine de geri al", danger:true }).then(function(ok){ if(ok) go(); });
    } else go();
  }
  function redoLast(){
    if(!requireStaff()) return;
    var entry = redoStack[redoStack.length - 1];
    if(!entry) return;
    var go = function(){
      if(!isUnlocked() || redoStack[redoStack.length - 1] !== entry) return;
      applyHistoryEntry(entry, "after");
      redoStack.pop();
      undoStack.push(entry);
      if(undoStack.length > MAX_UNDO) undoStack.shift();
      updateUndoBtn();
      updateRedoBtn();
    };
    if(historyConflicts(entry, "before")){
      askConfirm(CONFLICT_MSG, { yes:"Yine de ileri al", danger:true }).then(function(ok){ if(ok) go(); });
    } else go();
  }
  if(undoBtn) undoBtn.addEventListener("click", undoLast);
  if(redoBtn) redoBtn.addEventListener("click", redoLast);

  function onTableClick(rid, id){
    if(!requireStaff()) return;
    var k = key(rid, id);
    if(!hasKey(k)) return;
    var s = state[k];
    var today = todayStr();
    var prev = snapshotOf(k);
    var field;
    if(hasActiveReservation(s, today)){
      s.overrideDate = (s.overrideDate === today) ? "" : today;
      field = "overrideDate";
    } else {
      s.status = (s.status === "dolu") ? "bos" : "dolu";
      field = "status";
    }
    pushUndo(rid, k, prev);
    renderTableEl(k);
    renderRoomTableStates(rid);
    renderOverview();
    persist(k, [field]);
  }

  // ---- Saklama süresi: bitişinden RETENTION_DAYS gün geçmiş rezervasyonların kişisel verisi silinir ----
  function purgeExpired(){
    var cutoff = addDaysStr(todayStr(), -RETENTION_DAYS);
    if(!cutoff) return;
    ROOM_ORDER.forEach(function(rid){
      ROOMS[rid].tables.forEach(function(t){
        var k = key(rid, t.id);
        var s = state[k];
        if(s && s.resvEnd && s.resvEnd < cutoff){
          s.resvName = ""; s.resvStart = ""; s.resvEnd = ""; s.overrideDate = "";
          try{ renderTableEl(k); }catch(e){}
          persist(k, ["resvName","resvStart","resvEnd","overrideDate"], { silent:true });
        }
      });
    });
    safeRenderAll();
  }

  function safeRenderAll(){
    try{ renderAll(); }catch(e){}
  }

  var firstSnapshotDone = false;
  function initDb(){
    if(!window.claude || typeof window.claude.use !== "function"){
      setSyncText("Yerel modda çalışıyor (bu cihaza özel).");
      loadLocal();
      return;
    }
    window.claude.use("db").then(function(ns){
      if(!ns){
        setSyncText("Yerel modda çalışıyor (bu cihaza özel).");
        loadLocal();
        return;
      }
      db = ns;
      setSyncText("Tüm cihazlarla senkronize.");
      db.collection("tables").onSnapshot(function(snap){
        // Her belge ayrı ayrı ve korumalı işlenir: tek bozuk kayıt diğerlerini durduramaz.
        snap.docs.forEach(function(doc){
          if(!hasKey(doc.id)) return;
          try{
            state[doc.id] = doc.exists ? normalizeData(doc.data()) : blankTableData();
          }catch(e){
            state[doc.id] = blankTableData();
          }
        });
        safeRenderAll();
        if(!firstSnapshotDone){
          firstSnapshotDone = true;
          setTimeout(purgeExpired, 1500);
        }
      }, function(){
        setSyncText("Senkronizasyon durdu. Yerel moda geçildi.");
        db = null;
        loadLocal();
      });
    }).catch(function(){
      setSyncText("Yerel modda çalışıyor (bu cihaza özel).");
      loadLocal();
    });
  }

  document.getElementById("resetBtn").addEventListener("click", function(){
    if(!requireStaff()) return;
    var resetMsg = ROOMS[activeRoom].kind === "lockers"
      ? "Tüm dolapları BOŞ olarak işaretlemek istiyor musunuz? (Rezervasyonlar korunur. Bu işlem Geri Al ile geri alınabilir.)"
      : ROOMS[activeRoom].name + " salonundaki tüm masaları BOŞ olarak işaretlemek istiyor musunuz? (Rezervasyonlar korunur. Bu işlem Geri Al ile geri alınabilir.)";
    var rid = activeRoom;
    askConfirm(resetMsg, { yes:"Boşalt", danger:true }).then(function(ok){
      if(!ok || !isUnlocked()) return;
      var items = [];
      ROOMS[rid].tables.forEach(function(t){
        var k = key(rid, t.id);
        var before = snapshotOf(k);
        state[k].status = "bos";
        state[k].overrideDate = "";
        var after = snapshotOf(k);
        items.push({ k:k, before:before, after:after });
        renderTableEl(k);
        var ch = changedFields(before, after);
        if(ch.length) persist(k, ch);
      });
      pushUndoItems(rid, items);
      renderRoomTableStates(rid);
      renderOverview();
    });
  });

  // =========================================================================
  // REZERVASYON MODALI
  // =========================================================================
  var resvBackdrop = document.getElementById("resvBackdrop");
  var resvTableSelect = document.getElementById("resvTableSelect");
  var resvName = document.getElementById("resvName");
  var resvStart = document.getElementById("resvStart");
  var resvEnd = document.getElementById("resvEnd");

  function populateResvSelect(){
    resvTableSelect.innerHTML = "";
    // Tüm salonlarda ve dolaplarda liste numaraya göre artan sırada (j1, j2, ... / 1, 2, ...)
    var list = ROOMS[activeRoom].tables.slice();
    list.sort(function(a, b){ return parseInt(a.label.replace(/\D/g, ""), 10) - parseInt(b.label.replace(/\D/g, ""), 10); });
    list.forEach(function(t){
      var opt = document.createElement("option");
      opt.value = t.id;
      opt.textContent = t.label;
      resvTableSelect.appendChild(opt);
    });
  }

  function fillResvForm(id){
    var s = state[key(activeRoom, id)] || blankTableData();
    resvName.value = s.resvName || "";
    resvStart.value = s.resvStart || "";
    resvEnd.value = s.resvEnd || "";
  }

  resvTableSelect.addEventListener("change", function(){ fillResvForm(resvTableSelect.value); });

  document.getElementById("resvOpenBtn").addEventListener("click", function(){
    if(!requireStaff()) return;
    fillResvForm(resvTableSelect.value);
    resvBackdrop.classList.add("open");
  });
  document.getElementById("resvCancelBtn").addEventListener("click", function(){ resvBackdrop.classList.remove("open"); });
  resvBackdrop.addEventListener("click", function(e){ if(e.target === resvBackdrop) resvBackdrop.classList.remove("open"); });

  document.getElementById("resvSaveBtn").addEventListener("click", function(){
    if(!requireStaff()) return;
    var id = resvTableSelect.value;
    var k = key(activeRoom, id);
    if(!hasKey(k)) return;
    var name = cleanName(resvName.value);
    var start = resvStart.value;
    var end = resvEnd.value;
    if(!name || !start || !end){ showAlert("Lütfen ad soyad, başlangıç ve bitiş tarihini girin."); return; }
    if(!isDateStr(start) || !isDateStr(end)){ showAlert("Tarih biçimi geçersiz."); return; }
    if(end < start){ showAlert("Bitiş tarihi başlangıç tarihinden önce olamaz."); return; }
    var prevSave = snapshotOf(k);
    state[k].resvName = name;
    state[k].resvStart = start;
    state[k].resvEnd = end;
    state[k].overrideDate = "";
    pushUndo(activeRoom, k, prevSave);
    renderTableEl(k);
    renderRoomTableStates(activeRoom);
    renderOverview();
    persist(k, ["resvName","resvStart","resvEnd","overrideDate"]);
    resvBackdrop.classList.remove("open");
  });

  document.getElementById("resvClearBtn").addEventListener("click", function(){
    if(!requireStaff()) return;
    var id = resvTableSelect.value;
    var k = key(activeRoom, id);
    if(!hasKey(k)) return;
    var rid = activeRoom;
    var unit = (ROOMS[rid].unit || "Masa").toLocaleLowerCase("tr-TR");
    var label = (ROOMS[rid].tables.filter(function(t){ return t.id === id; })[0] || {}).label || id;
    var s0 = state[k];
    if(!s0.resvName && !s0.resvStart && !s0.resvEnd){
      showAlert("Seçili " + unit + " (" + label + ") için kayıtlı bir rezervasyon yok.");
      return;
    }
    askConfirm(label + " numaralı " + unit + " için rezervasyon kaldırılsın mı?", { yes:"Rezervasyonu Kaldır", danger:true }).then(function(ok){
      if(!ok || !isUnlocked()) return;
      var prevClear = snapshotOf(k);
      state[k].resvName = "";
      state[k].resvStart = "";
      state[k].resvEnd = "";
      state[k].overrideDate = "";
      pushUndo(rid, k, prevClear);
      resvName.value = ""; resvStart.value = ""; resvEnd.value = "";
      renderTableEl(k);
      renderRoomTableStates(rid);
      renderOverview();
      persist(k, ["resvName","resvStart","resvEnd","overrideDate"]);
      resvBackdrop.classList.remove("open");
      showToast("Rezervasyon kaldırıldı.");
    });
  });

  // =========================================================================
  // ORTAK YARDIMCILAR
  // =========================================================================
  var localMode = false;
  // Personel PIN kilidi kaldırıldı: ekran herkes için düzenlenebilir.
  function isUnlocked(){ return true; }
  function requireStaff(){ return true; }

  // ---- Uygulama içi onay / bilgi penceresi ----
  // Tarayıcının confirm()/alert() pencereleri claude.ai çerçevesinde ve Android WebView'da
  // engellenebildiği için (confirm hemen "hayır" döner) tüm onaylar bu pencereyle alınır.
  var dialogClose = null;
  function uiDialog(msg, opts){
    opts = opts || {};
    return new Promise(function(resolve){
      if(dialogClose) dialogClose(false);
      var bd = document.getElementById("confirmBackdrop");
      var yes = document.getElementById("confirmYes");
      var no = document.getElementById("confirmNo");
      document.getElementById("confirmText").textContent = msg;
      yes.textContent = opts.yes || "Evet";
      yes.className = "modal-btn " + (opts.danger ? "danger-solid" : "primary");
      no.textContent = opts.no || "Vazgeç";
      no.style.display = opts.alertOnly ? "none" : "";
      function onKey(e){
        if(e.key === "Escape"){ e.preventDefault(); close(false); }
        else if(e.key === "Enter"){ e.preventDefault(); close(true); }
      }
      function close(v){
        bd.classList.remove("open");
        yes.onclick = null; no.onclick = null; bd.onclick = null;
        document.removeEventListener("keydown", onKey, true);
        dialogClose = null;
        resolve(!!v);
      }
      yes.onclick = function(){ close(true); };
      no.onclick = function(){ close(false); };
      bd.onclick = function(e){ if(e.target === bd) close(false); };
      document.addEventListener("keydown", onKey, true);
      dialogClose = close;
      bd.classList.add("open");
      setTimeout(function(){ try{ yes.focus(); }catch(e){} }, 30);
    });
  }
  function askConfirm(msg, opts){ return uiDialog(msg, opts); }
  function showAlert(msg){ return uiDialog(msg, { alertOnly:true, yes:"Tamam" }); }

  // ---- Bildirim balonu ----
  var toastEl = document.getElementById("toast");
  var toastTimer = null;
  function showToast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toastEl.classList.remove("show"); }, 2600);
  }

  // =========================================================================
  // YEDEKLEME (yalnızca yerel modda: GitHub / APK sürümü, veriler cihazda)
  // =========================================================================
  document.getElementById("backupBtn").addEventListener("click", function(){
    if(!requireStaff()) return;
    var tables = {};
    Object.keys(state).forEach(function(k){ if(hasKey(k)) tables[k] = snapshotOf(k); });
    var payload = { app:"cosmos-rezervasyon", version:1, exportedAt:new Date().toISOString(), tables:tables };
    try{
      var blob = new Blob([JSON.stringify(payload, null, 2)], { type:"application/json" });
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url;
      a.download = "cosmos-yedek-" + todayStr() + ".json";
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(function(){ URL.revokeObjectURL(url); }, 5000);
      showToast("Yedek indirildi. Dosya müşteri adlarını içerir, güvenli bir yerde saklayın.");
    }catch(e){
      showToast("Yedek dosyası oluşturulamadı.");
    }
  });
  var restoreFile = document.getElementById("restoreFile");
  document.getElementById("restoreBtn").addEventListener("click", function(){
    if(!requireStaff()) return;
    restoreFile.value = "";
    restoreFile.click();
  });
  restoreFile.addEventListener("change", function(){
    var file = restoreFile.files && restoreFile.files[0];
    if(!file) return;
    if(!requireStaff()) return;
    if(file.size > 1024 * 1024){ showAlert("Dosya çok büyük; geçerli bir yedek dosyası değil."); return; }
    var reader = new FileReader();
    reader.onload = function(){
      var parsed;
      try{ parsed = JSON.parse(String(reader.result)); }catch(e){ showAlert("Dosya okunamadı: geçerli bir yedek değil."); return; }
      if(!parsed || parsed.app !== "cosmos-rezervasyon" || !parsed.tables || typeof parsed.tables !== "object"){
        showAlert("Bu dosya bir Cosmos Rezervasyon yedeği değil."); return;
      }
      var items = [];
      Object.keys(parsed.tables).forEach(function(k){
        if(!hasKey(k)) return;
        items.push({ k:k, before:snapshotOf(k), after:normalizeData(parsed.tables[k]) });
      });
      if(!items.length){ showAlert("Yedekte uygun kayıt bulunamadı."); return; }
      askConfirm(items.length + " masa/dolap kaydı yedekten yüklenecek ve mevcut durumun üzerine yazılacak. (Geri Al ile geri alınabilir.)", { yes:"Yedeği Yükle" }).then(function(ok){
        if(!ok || !isUnlocked()) return;
        items.forEach(function(it){ state[it.k] = Object.assign({}, it.after); });
        pushUndoItems(activeRoom, items);
        saveLocal();
        safeRenderAll();
        showToast("Yedek yüklendi.");
      });
    };
    reader.readAsText(file);
  });

  // =========================================================================
  // BAŞLAT
  // =========================================================================
  switchRoom("jupiter");
  populateResvSelect();
  initDb();

  // Gün değiştiğinde (gece yarısı) rezervasyon durumlarını ve uyarılarını otomatik güncelle
  var lastSeenDate = todayStr();
  setInterval(function(){
    var d = todayStr();
    if(d !== lastSeenDate){
      lastSeenDate = d;
      safeRenderAll();
      purgeExpired();
    }
  }, 60000);
})();

// PWA: service worker kaydı (yalnızca http/https üzerinden çalışır; file:// açılışında sessizce atlanır)
if ("serviceWorker" in navigator && (location.protocol === "https:" || location.protocol === "http:")) {
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("sw.js", { updateViaCache: "none" }).catch(function(){ /* sessizce yoksay */ });
  });
}
</script>
</body>
</html>
